# Automatically creates worker processes equal to CPU cores.
worker_processes auto;

events {
    
    # One worker can handle 1024 simultaneous connections
    worker_connections 1024;

    # Accept multiple connections at once
    multi_accept on;
}

http {

    # Loads file extension to MIME type mappings so browsers know how to correctly handle files like HTML, CSS, JS, PNG, JSON, etc.
    include /etc/nginx/mime.types;

    # Sets a fallback content type for unknown file extensions, usually forcing the browser to download the file safely as binary data.
    default_type application/octet-stream;

    # Optimized file transfer
    sendfile on;

    # Keep TCP connection alive
    keepalive_timeout 65s;

    # How long NGINX waits for the CLIENT to send the request body.
    client_body_timeout 15s;

    # How long NGINX waits for the client to send request headers.
    client_header_timeout 15s;

    # Security: limit request size to prevent abuse attacks
    client_max_body_size 10M;

    # Enable gzip compression
    gzip on;

    # set gzip compression level (1-9, where 5 is a good balance between compression and CPU usage)
    gzip_comp_level 5;

    # Only compress responses larger than 256 bytes
    gzip_min_length 256;

    # Without it, a cache might incorrectly serve a gzip-compressed response to a browser that does not support gzip.
    gzip_vary on;

    # Compress these MIME types
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # Backend upstream — 'backend' is the docker-compose service name
    upstream resume_ai_backend {
        least_conn;
        # Single instance for now. Add more servers here when scaling.
        server backend1:5000 max_fails=3 fail_timeout=30s;
        server backend2:5000 max_fails=3 fail_timeout=30s;
        server backend3:5000 max_fails=3 fail_timeout=30s;
    }

    # Frontend upstream — 'frontend' is the docker-compose service name
    upstream resume_ai_frontend {
        server frontend:3000;
    }

    # Rate Limiting: Define a shared memory zone for API rate limiting
    # 1mb can store around 16000 ip addresses.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Nginx Proxy Cache Path definitions:
    # - keys_zone: name and size of the shared memory zone (holds cache keys/metadata)
    # - levels: subdirectory level structure (e.g. 1:2 creates two-tier subdirectories)
    # - max_size: maximum space the cache can use on disk
    # - inactive: how long cached files remain without being accessed before deletion
    # - use_temp_path: off to write directly to cache directory and avoid copying files
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=resume_ai_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Redirect HTTP traffic to HTTPS
    server {
        # it is use to send each request render on port 80 as a http to port 443 as https with same uri
        listen 80;
        server_name localhost;

        location /api {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/?(.*)$ /$1 break;
            proxy_pass http://resume_ai_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            # added longer timeouts for API routes to accommodate potentially long-running operations
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_cache_bypass $http_upgrade;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS SERVER
    server {

        # it is use to listen https request on port 443
        listen 443 ssl;
        server_name localhost;

        # SSL Certificates
        # without certificates, browser can't trust servers identity or name
        ssl_certificate /etc/nginx/ssl/localhost.crt;
        ssl_certificate_key /etc/nginx/ssl/localhost.key;

        # SSL Protocols and Ciphers optimization
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---------------- API ROUTES → BACKEND ----------------
        location /api {
            # Rate Limiting: Allow 10 requests per second with burst support
            limit_req zone=api_limit burst=20 nodelay;

            # Rewrite /api/foo, /api/foo/, and accidental /api//foo to /foo
            # before proxying. This keeps the Docker client bundle stable even
            # when NEXT_PUBLIC_API_URL has or lacks a trailing slash.
            rewrite ^/api/?(.*)$ /$1 break;
            proxy_pass http://resume_ai_backend;
            proxy_http_version 1.1;

            # WebSocket Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Forward Important Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_cache_bypass $http_upgrade;
        }

        # ---------------- FRONTEND ROUTES ----------------
        location / {
            proxy_pass http://resume_ai_frontend;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_http_version 1.1;

            # WebSocket Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- PROXY CACHE CONFIGURATION ---
            proxy_cache resume_ai_cache;
            
            # Caching rules: Cache successful/redirect responses for 10 minutes
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            
            # Cache key definition
            proxy_cache_key "$scheme$request_method$host$request_uri";

            # Use stale cached responses if the backend is down or updating
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Prevent cache stampede: only allow one request to populate the cache at a time
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            # Bypass cache for authenticated users (cookie 'accessToken' exists) or WebSockets
            set $bypass_cache 0;
            if ($http_cookie ~* "accessToken") {
                set $bypass_cache 1;
            }
            if ($http_upgrade != "") {
                set $bypass_cache 1;
            }

            proxy_cache_bypass $bypass_cache;
            proxy_no_cache $bypass_cache;

            # Add header to let client know if Nginx served from cache
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ---------------- STATIC FILE CACHING (NEXT.JS BUILDS) ----------------
        # NOTE: Only effective in production build (Next.js hashed files)
        location ~* ^/_next/static/ {
            proxy_pass http://resume_ai_frontend;
            
            # Enable Nginx disk cache for static assets
            proxy_cache resume_ai_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;

            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            access_log off;
        }

        # ---------------- GENERAL STATIC ASSETS CACHING ----------------
        # Cache common static file extensions served by the frontend
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|webp)$ {
            proxy_pass http://resume_ai_frontend;
            
            # Enable Nginx disk cache for media/static files
            proxy_cache resume_ai_cache;
            proxy_cache_valid 200 302 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;

            expires 7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
            add_header X-Cache-Status $upstream_cache_status;
            access_log off;
        }

        # ---------------- ERROR PAGES ----------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
